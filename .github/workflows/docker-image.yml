name: Build and Push Multi-Arch Docker Image

on:
  workflow_dispatch:

  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64 and arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 使用 QEMU 模拟不同 CPU 架构
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 启用 Docker Buildx 多架构构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只有在非 PR 事件（即真正 push 或手动触发）时才登录 GHCR，节约时间并避开 PR 权限限制
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 智能生成 Docker 镜像标签
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # 1. 只有推送到 main/master 时才更新 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # 2. 如果是分支（如 v1.0.1），自动打上分支名的 tag（如 :v1.0.1）
            type=ref,event=branch
            # 3. 如果是 PR，打上 pr-123 的临时 tag
            type=ref,event=pr
            # 4. 如果是 Git Tag（如 v1.0.1-rc），打上对应的 tag
            type=ref,event=tag
            # 5. 带上 commit short sha（如 :sha-a1b2c3d），方便精确追踪每次提交
            type=sha,prefix=sha-

      # 构建 amd64 和 arm64
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          # 关键点：如果是 PR 触发，只做验证构建而不推送（push: false）；真正 push 代码时才推送到 GHCR
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
